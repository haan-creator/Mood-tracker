// ===== ENTRY SHEET =====
let entryPeriod = null;
let entryPicker = null;

function openEntrySheet(period) {
  entryPeriod = period;
  const idx = PERIOD_KEYS.indexOf(period);
  document.getElementById('entry-title').textContent = PERIOD_NAMES[idx];

  const todayD = String(today.getDate());
  const todayY = today.getFullYear(), todayM = today.getMonth();
  let todayData = {};
  let todayCycle = {};
  try {
    const raw = JSON.parse(localStorage.getItem(sKey(todayY, todayM)));
    const clean = sanitizeMonthData(raw);
    if (clean && clean[todayD]) todayData = clean[todayD];
  } catch {}
  try {
    const rawC = JSON.parse(localStorage.getItem(cKey(todayY, todayM)));
    const cleanC = sanitizeCycleData(rawC);
    if (cleanC && cleanC[todayD]) todayCycle = cleanC[todayD];
  } catch {}

  const existing = todayData[period];
  if (!entryPicker) {
    entryPicker = createMoodPicker(document.getElementById('entry-picker'), paintEntrySave);
  }
  entryPicker.setFromEntry(existing);
  paintEntrySave();

  // Note — always start collapsed
  const noteVal = existing?.note || '';
  document.getElementById('entry-note').value = noteVal;
  const noteToggle = document.getElementById('entry-note-toggle');
  const noteWrap = document.getElementById('entry-note-wrap');
  noteWrap.classList.remove('open');
  noteToggle.style.display = '';
  const toggleText = noteToggle.querySelector('span');
  if (noteVal) {
    toggleText.textContent = noteVal;
    toggleText.style.color = 'var(--text-mid)';
  } else {
    toggleText.textContent = '說說你的感受';
    toggleText.style.color = '#c0b8b0';
  }

  // Cycle

  document.getElementById('entry-overlay').classList.add('open');
  document.getElementById('entry-sheet').classList.add('open');
}

function closeEntrySheet() {
  // Dismissed before the ritual got its cue — run it anyway, or the
  // save would leave the sky untouched.
  if (window._ritualStartTimer) {
    clearTimeout(window._ritualStartTimer);
    window._ritualStartTimer = null;
    runSkyRitual();
  }
  if (window._saveRevertTimer) clearTimeout(window._saveRevertTimer);
  const saveBtn = document.getElementById('entry-save');
  if (saveBtn) { saveBtn.textContent = '記下來'; saveBtn.classList.remove('saved'); }
  document.getElementById('entry-overlay').classList.remove('open');
  document.getElementById('entry-sheet').classList.remove('open');
}

function paintEntrySave() {
  const saveBtn = document.getElementById('entry-save');
  if (!saveBtn || !entryPicker) return;
  const mood = entryPicker.mood();
  if (mood.score === 0) saveBtn.className = 'entry-save';
  else if (mood.type === 'positive') saveBtn.className = 'entry-save pos';
  else saveBtn.className = 'entry-save neg';
}

function toggleEntryNote() {
  document.getElementById('entry-note-wrap').classList.add('open');
  document.getElementById('entry-note-toggle').style.display = 'none';
  setTimeout(() => document.getElementById('entry-note').focus(), 100);
}


function saveEntry() {
  const todayD = String(today.getDate());
  const todayY = today.getFullYear(), todayM = today.getMonth();
  curYear = todayY; curMonth = todayM; loadData();
  if (!monthData[todayD]) monthData[todayD] = {};

  const mood = entryPicker.mood();
  const note = document.getElementById('entry-note').value.trim().slice(0, 500);
  monthData[todayD][entryPeriod] = { type: mood.type, score: mood.score, note: note || undefined };

  saveData();
  renderCalendar();
  // The sky itself is the confirmation — but only when it's the sky
  // you're actually looking at. Otherwise just refresh in place.
  const ritual = isSkyToday();
  if (!ritual) { updateSkyPeriods(); updateSkyGradient(); updateCloudState(); triggerCloudWind(); }

  // Collapse note area back to toggle
  const noteWrap = document.getElementById('entry-note-wrap');
  const noteToggle = document.getElementById('entry-note-toggle');
  noteWrap.classList.remove('open');
  noteToggle.style.display = '';
  const toggleText = noteToggle.querySelector('span');
  if (note) {
    toggleText.textContent = note;
    toggleText.style.color = 'var(--text-mid)';
  } else {
    toggleText.textContent = '說說你的感受';
    toggleText.style.color = '#c0b8b0';
  }

  // Show confirmed state, then get out of the way and let the sky answer.
  const saveBtn = document.getElementById('entry-save');
  saveBtn.classList.add('saved');
  saveBtn.textContent = '已記錄';
  if (window._saveRevertTimer) clearTimeout(window._saveRevertTimer);
  if (ritual) {
    if (window._ritualStartTimer) clearTimeout(window._ritualStartTimer);
    window._ritualStartTimer = setTimeout(() => {
      window._ritualStartTimer = null;
      closeEntrySheet();
      runSkyRitual();
    }, 220);
  } else {
    window._saveRevertTimer = setTimeout(() => {
      saveBtn.textContent = '記下來';
      paintEntrySave();
    }, 2000);
  }
}
</script>
<script>
const _v = document.getElementById('settings-version');
if (_v) _v.textContent = APP_VERSION;

// A client that already installed the original cache-first worker is
// pinned to whatever build it first loaded and cannot be reached by
// publishing. This is the way out from the phone itself.
document.getElementById('settings-refresh')?.addEventListener('click', async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch {}
  location.reload();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    // Check on every load, so a deploy is picked up without waiting for
    // the browser's own update schedule.
    reg.update();
    // A newly installed worker means the page in front of you is stale.
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', () => {
        if (sw.state === 'activated' && navigator.serviceWorker.controller) {
          location.reload();
        }
      });
    });
  }).catch(() => {});
}
</script>
